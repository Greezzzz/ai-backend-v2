# Prometheus scrape config untuk ai-backend-v2.
#
# App berjalan di host (uvicorn Windows), bukan di container — jadi target
# pakai `host.docker.internal`. Kalau app nanti di-containerize, ganti ke
# nama service (mis. `app:8000`).
#
# /metrics dilindungi X-API-Key — nilai harus sama dengan API_KEY di `.env`.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "ai-backend-v2"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
    # Kirim header X-API-Key supaya scrape lolos proteksi /metrics.
    # Ganti nilai ini kalau API_KEY di .env diubah.
    http_headers:
      X-API-Key:
        values: ["masak-nasi-goreng"]
