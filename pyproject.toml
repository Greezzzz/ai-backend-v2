[project]
name = "ai-backend-v2"
version = "0.1.0"
description = "Backend AI untuk belajar — FastAPI + PostgreSQL + LLM (goals.md & roadmap.md)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.0.0",
    "fastapi>=0.139.2",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp-proto-http>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
    "openai>=2.46.0",
    "pgvector>=0.3.0",
    "prometheus-client>=0.26.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.10.0",
    "pwdlib[argon2]>=0.2.1",
    "python-multipart>=0.0.9",
    "redis>=6.0.0",
    "rq>=2.0.0",
    "sqlalchemy>=2.0.51",
    "tiktoken>=0.9.0",
    "transformers>=5.15.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_ignores = false
